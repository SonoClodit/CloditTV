name: clodit_tv
description: Catalogo cinematografico personale per iPhone e iPad.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/clodittv_app_icon.png

flutter_launcher_icons:
  ios: true
  android: false
  image_path: assets/images/clodittv_app_icon.png
  remove_alpha_ios: true
